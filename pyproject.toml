[project]
name = "blueprint-integration-hass"
version = "0.1.0"
description = "Blueprint Home Assistant custom integration"
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
check_untyped_defs = true
files = ["custom_components/example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live' -v --tb=short"
markers = [
  "live: tests that need real credentials (deselected by default)",
]

[tool.coverage.run]
source = ["custom_components/example"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]
